[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casework"
version = "0.1.0"
description = "Auditable data operations, predictive analytics and customer-request routing"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "flask>=3,<4", "joblib>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["casework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

